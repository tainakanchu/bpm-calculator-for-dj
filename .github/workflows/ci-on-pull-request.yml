name: ci-on-pr

on:
  push:
    branches:
      - 'develop'
      - 'master'
  pull_request:
    branches:
      - 'develop'
      - 'master'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Format, lint, build & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pnpm のバージョンは package.json の packageManager から読み取られる
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      # oxlint --type-aware で correctness + 型認識ルールを検証する
      - name: Lint
        run: pnpm lint

      # build スクリプトは `tsc -b && vite build` なので型チェックも兼ねる
      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

  check-version:
    runs-on: ubuntu-latest
    # master への PR の時のみ実施
    if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'master'

    steps:
      # master と PRの HEAD をチェックアウトする
      - name: Checkout master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0

      - name: Checkout PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      # master ブランチのバージョンを取得
      - name: Get master version
        id: get_master_version
        run: |
          echo "version=$(git show origin/master:package.json | jq -r '.version')" >> $GITHUB_OUTPUT

      # PR ブランチのバージョンを取得
      - name: Get PR version
        id: get_pr_version
        run: |
          echo "version=$(git show HEAD:package.json | jq -r '.version')" >> $GITHUB_OUTPUT

      # PR ブランチのバージョンが master ブランチのバージョンと一致する場合は fail
      - name: Check version
        run: |
          if [ "${{ steps.get_master_version.outputs.version }}" = "${{ steps.get_pr_version.outputs.version }}" ]; then
            echo "Version is same"
            exit 1
          else
            echo "Version is different"
          fi
